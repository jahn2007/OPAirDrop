name: OnePlus Ace 2 — SM8475 source and kernel baseline

on:
  workflow_dispatch:
    inputs:
      full_kernel:
        description: 'Sync and compile official SM8475 kernel (large disk/CPU required)'
        type: boolean
        default: true
      candidate_port:
        description: 'Experimental PAS/NDI WMA/HDD kernel compile; no device install'
        type: boolean
        default: false
  push:
    branches: [feat/oneplus-ace2-sm8475]
    paths:
      - 'platforms/oneplus-ace2/**'
      - 'tools/ace2-*.py'
      - 'tools/ace2-build-baseline.sh'
      - 'tools/ace2-stage-candidate.sh'
      - 'tools/ace2-sync-kernel.sh'
      - 'tests/test_ace2_sync_kernel.py'
      - 'kernel/ace2/**'
      - 'tests/ace2-frame-test.c'
      - 'tests/test_ace2_wma_hook.py'
      - 'tests/test_ace2_hdd_tx.py'
      - '.github/workflows/ace2-kernel.yml'
  pull_request:
    paths:
      - 'platforms/oneplus-ace2/**'
      - 'tools/ace2-*.py'
      - 'tools/ace2-build-baseline.sh'
      - 'tools/ace2-stage-candidate.sh'
      - 'tools/ace2-sync-kernel.sh'
      - 'tests/test_ace2_sync_kernel.py'
      - '.github/workflows/ace2-kernel.yml'

permissions:
  contents: read

concurrency:
  group: ace2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python tools
        run: |
          python3 -m py_compile tools/ace2-source-audit.py tools/ace2-artifact-report.py tools/ace2-port-core.py tools/ace2-port-overlays.py tools/ace2-resolve-core.py tools/ace2-port-wma-hook.py tests/test_ace2_wma_hook.py tools/ace2-port-hdd-tx.py tests/test_ace2_hdd_tx.py
          python3 -m unittest discover -s tests -p 'test_ace2_wma_hook.py'
          python3 -m unittest discover -s tests -p 'test_ace2_hdd_tx.py'
          python3 -m unittest discover -s tests -p 'test_ace2_sync_kernel.py'
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 -o "$RUNNER_TEMP/ace2-frame-test" tests/ace2-frame-test.c
          "$RUNNER_TEMP/ace2-frame-test"
          bash -n tools/ace2-build-baseline.sh tools/ace2-stage-candidate.sh tools/ace2-sync-kernel.sh
      - name: Clone public OnePlus Ace 2 vendor source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch \
            --branch oneplus/sm8475_v_15.0.0_ace_2 \
            https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8475.git \
            "$RUNNER_TEMP/ace2-vendor"
          git -C "$RUNNER_TEMP/ace2-vendor" rev-parse HEAD > "$RUNNER_TEMP/source-revision.txt"
          python3 tools/ace2-source-audit.py --source "$RUNNER_TEMP/ace2-vendor" --json > "$RUNNER_TEMP/source-audit.json"
      - name: Prepare real SM8475 QDF mode patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ace2-port-core.py --source "$RUNNER_TEMP/ace2-vendor" --dry-run
          python3 tools/ace2-port-core.py --source "$RUNNER_TEMP/ace2-vendor" --report "$RUNNER_TEMP/pas-host-mode.json"
          # Repeat application to prove our source rewrite is idempotent.
          python3 tools/ace2-port-core.py --source "$RUNNER_TEMP/ace2-vendor"
          git -C "$RUNNER_TEMP/ace2-vendor" add -N vendor/qcom/opensource/wlan/qcacld-3.0/core/wma/src/ace2_awdl_frame.h
          git -C "$RUNNER_TEMP/ace2-vendor" diff --check
          git -C "$RUNNER_TEMP/ace2-vendor" diff -- \
            vendor/qcom/opensource/wlan/qca-wifi-host-cmn/qdf/inc/qdf_types.h \
            vendor/qcom/opensource/wlan/qca-wifi-host-cmn/qdf/src/qdf_types.c \
            vendor/qcom/opensource/wlan/qca-wifi-host-cmn/dp/inc/cdp_txrx_cmn_struct.h \
            vendor/qcom/opensource/wlan/qcacld-3.0/Kconfig \
            > "$RUNNER_TEMP/ace2-core-platform.patch"
          test -s "$RUNNER_TEMP/ace2-core-platform.patch"
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace2-vendor-source-audit
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/source-audit.json
            ${{ runner.temp }}/source-revision.txt
            ${{ runner.temp }}/pas-host-mode.json
            ${{ runner.temp }}/ace2-core-platform.patch
  # An explicit [ace2-candidate-kernel] commit requests disposable compiler
  # diagnostics; never publish an unverified WLAN .ko as an installable module.
  kernel-baseline:
    if: (github.event_name == 'workflow_dispatch' && inputs.full_kernel) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[ace2-full-kernel]') || contains(github.event.head_commit.message, '[ace2-candidate-kernel]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free space and install build requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/local/share/powershell || true
          sudo apt-get update
          sudo apt-get install -y git git-lfs curl python3 rsync unzip zip bc bison flex libssl-dev \
             libelf-dev libncurses-dev cpio lz4 zstd dwarves kmod jq
          df -h .
      - name: Sync official Ace 2 kernel and compile baseline modules
        shell: bash
        run: |
          set -euo pipefail
          export ACE2_APPLY_MODE_PATCH=1
          export ACE2_COMPILE_CANDIDATE="${{ (github.event_name == 'workflow_dispatch' && inputs.candidate_port || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ace2-candidate-kernel]'))) && '1' || '0' }}"
          export ACE2_PORT_ROOT="$GITHUB_WORKSPACE"
          export ACE2_BUILD_ROOT="$RUNNER_TEMP/ace2"
          bash tools/ace2-build-baseline.sh
      - name: Upload source lock, kernel-module inventory, failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace2-kernel-baseline-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/ace2/reports/**
            ${{ runner.temp }}/ace2/platform/LOGDIR/*.log
